<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAWNED SOULS - 3D Souls Chess Action</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #00f0ff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* HUD Overlay Layout */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* Stats Panel */
        .stats-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 8px 12px;
            width: fit-content;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .stat-line {
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 6px #00f0ff;
        }

        /* Bottom Controls Layout */
        .controls-bottom {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #a855f7;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
        }

        /* Nav D-Pad & Camera Row */
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            gap: 4px;
        }
        .dpad-btn {
            height: 38px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #00f0ff;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .dpad-btn:active {
            background: #00f0ff;
            color: #030712;
            box-shadow: 0 0 12px #00f0ff;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(2, 42px);
            gap: 4px;
        }
        .cam-btn {
            height: 38px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #a855f7;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .cam-btn:active {
            background: #a855f7;
            color: #ffffff;
        }

        /* Action Buttons Grid - Diperbesar */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .action-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #00f0ff;
            color: #ffffff;
            font-size: 10px;
            font-weight: 900;
            padding: 10px 2px;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2);
            touch-action: manipulation;
        }
        .action-btn span {
            font-size: 8px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .action-btn:active {
            background: #00f0ff;
            color: #030712;
            box-shadow: 0 0 14px #00f0ff;
        }
        .btn-parry { border-color: #facc15; }
        .btn-roll { border-color: #ef4444; }
        .btn-knight { border-color: #a855f7; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <!-- Status Display -->
        <div class="stats-panel">
            <div class="stat-line" id="val-hp">PAWN HERO: 100 / 100</div>
            <div class="stat-line" id="val-stamina">STAMINA: 100 / 100</div>
            <div class="stat-line" id="val-soul">SOUL ENERGY: 0%</div>
            <div class="stat-line" id="val-wave" style="color:#facc15;">WAVE 1 - ENEMIES: 3</div>
        </div>

        <!-- Larger Controls Layout -->
        <div class="controls-bottom">
            <div class="nav-row">
                <!-- Movement D-Pad -->
                <div class="dpad-grid">
                    <div></div>
                    <button class="dpad-btn" onclick="movePlayer(0, -1)">N</button>
                    <div></div>
                    <button class="dpad-btn" onclick="movePlayer(-1, 0)">W</button>
                    <div></div>
                    <button class="dpad-btn" onclick="movePlayer(1, 0)">E</button>
                    <div></div>
                    <button class="dpad-btn" onclick="movePlayer(0, 1)">S</button>
                    <div></div>
                </div>

                <!-- Camera Angle Controls -->
                <div>
                    <div style="font-size:9px; font-weight:bold; color:#a855f7; margin-bottom:2px; text-align:center;">KAMERA</div>
                    <div class="cam-grid">
                        <button class="cam-btn" onclick="rotateCam(-0.2)">&lt;</button>
                        <button class="cam-btn" onclick="rotateCam(0.2)">&gt;</button>
                        <button class="cam-btn" onclick="zoomCam(-1)">-</button>
                        <button class="cam-btn" onclick="zoomCam(1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Action Combat Buttons -->
            <div class="actions-grid">
                <button class="action-btn" onclick="doAttack()">
                    SLASH
                    <span>LIGHT ATK</span>
                </button>
                <button class="action-btn btn-parry" onclick="doParry()">
                    PARRY
                    <span>DEFLECT</span>
                </button>
                <button class="action-btn btn-roll" onclick="doRoll()">
                    ROLL
                    <span>DODGE</span>
                </button>
                <button class="action-btn btn-knight" onclick="doKnightDash()">
                    KNIGHT
                    <span>L-DASH</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, playerGroup, swordMesh;
        let enemies = [];
        let playerPos = { x: 3, z: 6 };
        let playerHP = 100;
        let stamina = 100;
        let soulEnergy = 0;
        let isParrying = false;
        let camAngle = 0;
        let camRadius = 14;

        // Web Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'slash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'parry') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030712);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
            dirLight.position.set(5, 15, 8);
            scene.add(dirLight);

            // Papan Catur 8x8 3D
            createChessboard();

            // Hero Player (Pawn Hero)
            playerGroup = new THREE.Group();
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.2, 16), playerMat);
            body.position.y = 0.6;
            playerGroup.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), playerMat);
            head.position.y = 1.4;
            playerGroup.add(head);

            // Pedang Hero
            const swordMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            swordMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.1), swordMat);
            swordMesh.position.set(0.4, 1.0, 0.3);
            swordMesh.rotation.x = Math.PI / 4;
            playerGroup.add(swordMesh);

            updatePlayerWorldPos();
            scene.add(playerGroup);

            // Spawning Enemy Pawns
            spawnEnemies();

            animate();
        }

        function createChessboard() {
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const lightMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });

            for (let x = 0; x < 8; x++) {
                for (let z = 0; z < 8; z++) {
                    const tile = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 1.8), ((x + z) % 2 === 0) ? lightMat : darkMat);
                    tile.position.set((x - 3.5) * 2, -0.1, (z - 3.5) * 2);
                    scene.add(tile);
                }
            }
        }

        function spawnEnemies() {
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const positions = [{ x: 2, z: 1 }, { x: 4, z: 1 }, { x: 5, z: 2 }];

            positions.forEach(pos => {
                let enemyGroup = new THREE.Group();
                let mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 1.2, 16), enemyMat);
                mesh.position.y = 0.6;
                enemyGroup.add(mesh);
                enemyGroup.userData = { gridX: pos.x, gridZ: pos.z, hp: 40 };

                enemyGroup.position.set((pos.x - 3.5) * 2, 0, (pos.z - 3.5) * 2);
                scene.add(enemyGroup);
                enemies.push(enemyGroup);
            });
        }

        function movePlayer(dx, dz) {
            let newX = Math.max(0, Math.min(7, playerPos.x + dx));
            let newZ = Math.max(0, Math.min(7, playerPos.z + dz));
            playerPos.x = newX;
            playerPos.z = newZ;
            updatePlayerWorldPos();
        }

        function updatePlayerWorldPos() {
            playerGroup.position.set((playerPos.x - 3.5) * 2, 0, (playerPos.z - 3.5) * 2);
        }

        function doAttack() {
            playSfx('slash');
            swordMesh.rotation.z -= 1.5;
            setTimeout(() => { swordMesh.rotation.z += 1.5; }, 150);

            // Cek Hit Ke Musuh Terdekat
            enemies.forEach((e, idx) => {
                let dist = Math.abs(e.userData.gridX - playerPos.x) + Math.abs(e.userData.gridZ - playerPos.z);
                if (dist <= 1) {
                    e.userData.hp -= 25;
                    if (e.userData.hp <= 0) {
                        scene.remove(e);
                        enemies.splice(idx, 1);
                    }
                }
            });
            updateStatsHUD();
        }

        function doParry() {
            isParrying = true;
            playSfx('parry');
            playerGroup.scale.set(1.2, 0.9, 1.2);
            setTimeout(() => {
                playerGroup.scale.set(1, 1, 1);
                isParrying = false;
            }, 600);
        }

        function doRoll() {
            if (stamina >= 20) {
                stamina -= 20;
                movePlayer(0, -2);
                updateStatsHUD();
            }
        }

        function doKnightDash() {
            if (stamina >= 30) {
                stamina -= 30;
                movePlayer(1, -2); // Pola Huruf L
                updateStatsHUD();
            }
        }

        function rotateCam(dir) { camAngle += dir; updateCamera(); }
        function zoomCam(val) { camRadius = Math.max(8, Math.min(22, camRadius + val)); updateCamera(); }

        function updateCamera() {
            camera.position.x = playerGroup.position.x + Math.sin(camAngle) * camRadius;
            camera.position.z = playerGroup.position.z + Math.cos(camAngle) * camRadius;
            camera.position.y = playerGroup.position.y + 8;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z);
        }

        function updateStatsHUD() {
            document.getElementById('val-hp').innerText = `PAWN HERO: ${playerHP} / 100`;
            document.getElementById('val-stamina').innerText = `STAMINA: ${stamina} / 100`;
            document.getElementById('val-wave').innerText = `WAVE 1 - ENEMIES: ${enemies.length}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Regenerasi Stamina Bertahap
            if (stamina < 100) stamina = Math.min(100, stamina + 0.1);
            updateStatsHUD();

            updateCamera();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
