<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Flappy Bird Sederhana</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background-color: #70c5ce;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Modal Overlay untuk Game Over & Start */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .card {
            background: #222831;
            padding: 24px 32px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 2px solid #393e46;
            max-width: 80%;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #00adb5;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #eeeeee;
        }

        .btn {
            background: #00adb5;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 173, 181, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background: #00888e;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Layar Mulai / Game Over -->
        <div id="overlay" class="overlay">
            <div class="card">
                <h1 id="title-text">Petualangan Burung</h1>
                <p id="info-text">Ketuk layar atau tekan Spacebar untuk melompat!</p>
                <p id="score-text" class="hidden">Skor Akhir: 0</p>
                <button id="start-btn" class="btn">Mulai Game</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const titleText = document.getElementById('title-text');
        const infoText = document.getElementById('info-text');
        const scoreText = document.getElementById('score-text');

        // Pengaturan Ukuran Canvas
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Status Game
        let isGameRunning = false;
        let score = 0;
        let highScore = 0;
        let frameCount = 0;

        // --- STREAMING_CHUNK:Defining player (bird) properties and physics... ---
        const bird = {
            x: 60,
            y: canvas.height / 2,
            radius: 14,
            gravity: 0.35,
            lift: -6.5,
            velocity: 0,
            color: '#ffc107',
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#d39e00';
                ctx.stroke();
                ctx.closePath();

                // Mata Burung
                ctx.beginPath();
                ctx.arc(this.x + 6, this.y - 4, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.closePath();

                ctx.beginPath();
                ctx.arc(this.x + 7, this.y - 4, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.closePath();

                // Paruh Burung
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y);
                ctx.lineTo(this.x + 18, this.y + 3);
                ctx.lineTo(this.x + 10, this.y + 6);
                ctx.fillStyle = '#ff5722';
                ctx.fill();
                ctx.closePath();
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Batas Bawah (Lantai)
                if (this.y + this.radius >= canvas.height - 30) {
                    this.y = canvas.height - 30 - this.radius;
                    gameOver();
                }

                // Batas Atas (Atap)
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },

            jump() {
                if (isGameRunning) {
                    this.velocity = this.lift;
                }
            },

            reset() {
                this.y = canvas.height / 2;
                this.velocity = 0;
            }
        };

        // --- STREAMING_CHUNK:Managing pipe obstacles and generation... ---
        const pipes = [];
        const pipeWidth = 52;
        const pipeGap = 130;
        const pipeSpeed = 2;

        function createPipe() {
            const minHeight = 40;
            const maxHeight = canvas.height - pipeGap - 70;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                // Pipa Atas
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 3;
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                // Pipa Bawah
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });
        }

        function updatePipes() {
            if (frameCount % 100 === 0) {
                createPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                // Cek Penambahan Skor
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                }

                // Cek Tabrakan
                if (
                    bird.x + bird.radius > pipes[i].x &&
                    bird.x - bird.radius < pipes[i].x + pipeWidth
                ) {
                    if (
                        bird.y - bird.radius < pipes[i].top ||
                        bird.y + bird.radius > canvas.height - pipes[i].bottom
                    ) {
                        gameOver();
                    }
                }

                // Hapus Pipa Lewat Screen
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        // --- STREAMING_CHUNK:Rendering background, floor, and score UI... ---
        function drawGround() {
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = '#558b2f';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 5);
        }

        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(score, canvas.width / 2 - 10, 45);
            ctx.shadowBlur = 0;
        }

        // --- STREAMING_CHUNK:Game loop control and input event handlers... ---
        function gameLoop() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bird.update();
            bird.draw();

            updatePipes();
            drawPipes();

            drawGround();
            drawScore();

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            frameCount = 0;
            pipes.length = 0;
            bird.reset();
            isGameRunning = true;

            overlay.classList.add('hidden');
            gameLoop();
        }

        function gameOver() {
            isGameRunning = false;

            if (score > highScore) {
                highScore = score;
            }

            titleText.innerText = 'Game Over!';
            infoText.innerText = `Skor Tertinggi: ${highScore}`;
            scoreText.innerText = `Skor Kamu: ${score}`;
            scoreText.classList.remove('hidden');
            startBtn.innerText = 'Coba Lagi';
            overlay.classList.remove('hidden');
        }

        // Kontrol Input (Sentuhan & Keyboard)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!isGameRunning && overlay.classList.contains('hidden')) {
                    return;
                }
                bird.jump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            bird.jump();
        });

        canvas.addEventListener('mousedown', () => {
            bird.jump();
        });

        startBtn.addEventListener('click', startGame);

        // Gambar latar awal saat pertama dimuat
        bird.draw();
        drawGround();
    </script>
</body>
</html>
