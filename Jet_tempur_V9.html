<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jet Tempur V-9 Simulator</title>
<style>
:root{--b:min(11.5vw,50px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05061a;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;color:#7ff;font:700 12px monospace;letter-spacing:1px;text-shadow:0 0 8px #0ff;pointer-events:none}
#top b{color:#ff6ae6;text-shadow:0 0 8px #f0c}
#hud{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad,.act{display:grid;gap:5px;pointer-events:auto}
.pad{grid-template-columns:repeat(3,var(--b))}
.act{grid-template-columns:repeat(4,calc(var(--b)*1.05))}
button{position:relative;height:var(--b);border:1px solid #0ffa;border-radius:10px;background:rgba(10,14,44,.75);color:#9ff;font:700 11px sans-serif;box-shadow:0 0 8px #0ff3 inset;padding:0;touch-action:none}
button:active,button.on{background:rgba(0,220,255,.45);color:#fff}
button i{position:absolute;right:4px;top:2px;font:700 10px monospace;font-style:normal;color:#ffd35c}
button.cd{opacity:.5}
button.act2{border-color:#7fffb0;box-shadow:0 0 12px #7fffb0;color:#eafff2}
.w2{grid-column:span 2}
#fire{color:#fff;border-color:#ff2bd6;box-shadow:0 0 8px #f0c4 inset}
#fire:active{background:rgba(255,43,214,.5)}
/* ---- fitur tambahan ---- */
#ex{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom) + var(--b)*2 + 10px);display:grid;grid-template-columns:repeat(3,1fr);width:calc(var(--b)*4.2 + 15px);gap:5px;pointer-events:auto}
#ex button{border-color:#ff2bd6;box-shadow:0 0 8px #f0c3 inset;font-size:clamp(8px,2.5vw,10px);line-height:1.15}
#ex button.on{background:rgba(255,43,214,.45)}
#mk{position:fixed;inset:0;pointer-events:none}
#left{position:fixed;left:14px;top:calc(34px + env(safe-area-inset-top));width:min(48vw,210px);padding:6px 8px;background:rgba(10,14,44,.65);border:1px solid #0ffa;border-radius:10px;color:#9ff;font:700 10px monospace;letter-spacing:.5px;pointer-events:none;text-shadow:0 0 6px #0ff}
.hr{display:flex;justify-content:space-between;gap:6px}
.bar{height:8px;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden;margin:2px 0 5px}
.bar i{display:block;height:100%;width:100%}
#hpb{background:linear-gradient(90deg,#ff2b6a,#ffb02b)}
#shb{background:linear-gradient(90deg,#2b8bff,#7ffbff)}
#enb{background:linear-gradient(90deg,#b26bff,#ff2bd6)}
#inf{font-weight:400;color:#ffe9a0;line-height:1.5;white-space:pre}
#rad{position:fixed;right:8px;top:calc(34px + env(safe-area-inset-top));width:min(26vw,104px);height:min(26vw,104px);border-radius:50%;border:1px solid #0ffa;box-shadow:0 0 12px #0ff6;pointer-events:none}
#bn{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#bn b{display:block;font:700 clamp(26px,8vw,46px) monospace;letter-spacing:.2em;color:#fff;text-shadow:0 0 12px #0ff,0 0 30px #f0c}
#bn span{font:700 12px monospace;color:#ffe9a0;letter-spacing:.08em}
#tt{position:fixed;left:50%;top:38%;transform:translateX(-50%);font:700 14px monospace;color:#ffe9a0;text-shadow:0 0 8px #f0c,0 2px 4px #000;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
#fl{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 40%,rgba(255,20,60,.7));opacity:0}
.ov{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(40,6,70,.85),rgba(3,0,12,.94));display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;z-index:30;padding:20px;font:700 clamp(22px,7vw,36px) monospace;letter-spacing:.15em;color:#fff;text-shadow:0 0 12px #0ff,0 0 30px #f0c}
.ov small{font:400 13px/1.6 sans-serif;letter-spacing:0;color:#cfeaff;text-shadow:none}
.ov button{height:auto;padding:14px 26px;font-size:15px;letter-spacing:.1em;width:min(86vw,340px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mk"></canvas>
<div id="top"><div>V-9 • <b id="st">SIAGA</b></div><div>SPD <b id="sp">0</b> km/h &nbsp; ALT <b id="al">0</b> m</div></div>
<div id="left">
  <div class="hr"><span>❤ HP</span><span id="hpt">100.000</span></div>
  <div class="bar"><i id="hpb"></i></div>
  <div class="bar" id="shw" style="display:none"><i id="shb"></i></div>
  <div class="hr"><span>⚡ ENERGI</span></div>
  <div class="bar"><i id="enb"></i></div>
  <div id="inf"></div>
</div>
<canvas id="rad" width="200" height="200"></canvas>
<div id="bn"><b></b><span></span></div>
<div id="tt"></div>
<div id="fl"></div>
<div id="ex">
  <button id="bMs">🚀<br>RUDAL<i id="cMs"></i></button>
  <button id="bBs">⚡<br>AKSELERASI</button>
  <button id="bSt">👻<br>STEALTH<i id="cSt"></i></button>
  <button id="bRl">🌀 MANUVER<br>360°<i id="cRl"></i></button>
  <button id="bJb">↩ JUMPING<br>BACK<i id="cJb"></i></button>
</div>
<div id="hud">
  <div class="pad">
    <i></i><button data-d="u">▲</button><i></i>
    <button data-d="l">◀</button><i></i><button data-d="r">▶</button>
    <i></i><button data-d="d">▼</button><i></i>
  </div>
  <div class="act">
    <button id="fire" class="w2">TEMBAK</button><button id="bGo" class="w2">TAKE OFF</button>
    <button id="cL">KAM &lt;</button><button id="cRs" class="w2">RESET KAM</button><button id="cR">KAM &gt;</button>
  </div>
</div>
<div class="ov" id="buff">🏆 BOOSTER WAVE
  <small>Pilih satu booster. Otomatis acak dalam <span id="bt">12</span> detik.</small>
  <button id="bb1">🚀 RUDAL SALVO ×4<br><small>Damage rudal 2× lipat · 4 rudal sekali tembak</small></button>
  <button id="bb2">🛡️ ARMOR TEBAL<br><small>HP +500.000 · Shield +250.000</small></button>
</div>
<div class="ov" id="over">💥 JET HANCUR<small id="osc"></small><button id="again">MAIN LAGI</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), V3=THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.round(n).toLocaleString('id-ID');
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- AUDIO (Web Audio API, sintetis) ---------- */
let ac,nbuf,eng,engT=0;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function noise(){ const a=audio(); if(!nbuf){ nbuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return nbuf; }
function tone(type,f1,f2,dur,vol,delay=0){
  const a=audio(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function nz(ft,f0,f1,dur,vol){
  const a=audio(),t=a.currentTime,n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  n.buffer=noise(); f.type=ft; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); n.stop(t+dur);
}
function sfxLaser(){ tone('sawtooth',2400,280,.16,.16); tone('square',1200,150,.12,.06); }
let lastHitS=0;
const sfx={
  elaser(v){ if(!ac) return; tone('sawtooth',620,160,.14,.05*v); },
  missile(){ if(!ac) return; nz('bandpass',500,3000,.7,.3); tone('sawtooth',160,700,.5,.1); },
  bossMissile(){ if(!ac) return; nz('bandpass',200,1500,1.2,.4); tone('sawtooth',90,420,1,.2); tone('square',440,330,.6,.08,.2); },
  boom(v){ if(!ac) return; nz('lowpass',2200,50,1,.9*v); tone('sine',120,28,.9,.7*v); },
  hit(v){ if(!ac) return; const n=performance.now(); if(n-lastHitS<70) return; lastHitS=n; nz('lowpass',1500,200,.12,.25*v); },
  hurt(){ if(!ac) return; nz('lowpass',900,120,.25,.4); tone('sawtooth',150,50,.3,.2); },
  stealth(on){ if(!ac) return; if(on){ tone('sine',260,1300,.5,.14); tone('sine',1300,520,.5,.1,.45); } else tone('sine',900,200,.5,.12); },
  roll(){ if(!ac) return; nz('bandpass',300,2200,.9,.22); },
  jump(){ if(!ac) return; nz('bandpass',200,2600,.5,.3); tone('sawtooth',120,520,.45,.1); tone('sawtooth',520,140,.6,.1,.5); },
  boost(){ if(!ac) return; nz('bandpass',200,1800,.8,.25); },
  buff(){ if(!ac) return; [523,659,784,1046].forEach((f,i)=>tone('triangle',f,f*1.01,.25,.12,i*.1)); },
  wave(){ if(!ac) return; tone('sawtooth',220,440,.5,.08); tone('sawtooth',330,660,.5,.06,.15); },
  alarm(){ if(!ac) return; tone('square',880,880,.15,.08); tone('square',660,660,.15,.08,.2); tone('square',880,880,.15,.08,.4); }
};
function engInit(){
  if(eng) return; const a=audio();
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noise(); s.loop=true; f.type='lowpass'; f.frequency.value=300; g.gain.value=0;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  const o1=a.createOscillator(),o2=a.createOscillator(),lp=a.createBiquadFilter(),og=a.createGain();
  o1.type='sawtooth'; o2.type='triangle'; lp.type='lowpass'; lp.frequency.value=900; og.gain.value=0;
  o1.connect(lp); o2.connect(lp); lp.connect(og); og.connect(a.destination); o1.start(); o2.start();
  eng={f,g,o1,o2,og};
}
function engUpdate(level,spd){
  if(!eng||performance.now()-engT<80) return; engT=performance.now();
  const t=ac.currentTime,tc=.15;
  eng.g.gain.setTargetAtTime(level*(.18+.32*spd),t,tc);
  eng.f.frequency.setTargetAtTime(250+1700*Math.max(spd,level*.25),t,tc);
  eng.o1.frequency.setTargetAtTime(55+60*level+160*spd,t,tc);
  eng.o2.frequency.setTargetAtTime(400+300*level+1200*spd,t,tc);
  eng.og.gain.setTargetAtTime(level*(.04+.05*spd),t,tc);
}
document.addEventListener('visibilitychange',()=>{ if(ac) document.hidden?ac.suspend():ac.resume(); });

/* ---------- SCENE ---------- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(); S.fog=new THREE.Fog(0x4a3396,140,460);
const cam=new THREE.PerspectiveCamera(62,1,1,2500);
const MKc=$('mk'), mx=MKc.getContext('2d');
function rs(){
  R.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  const d=Math.min(devicePixelRatio||1,2); MKc.width=innerWidth*d; MKc.height=innerHeight*d;
  MKc.style.width=innerWidth+'px'; MKc.style.height=innerHeight+'px'; mx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',rs); rs();

S.add(new THREE.AmbientLight(0xbfd0ff,.85));
S.add(new THREE.HemisphereLight(0x9fb4ff,0x2a2a60,.7));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(30,60,20); S.add(sun);
const fillL=new THREE.DirectionalLight(0xff4fd8,.6); fillL.position.set(-30,20,-40); S.add(fillL);

const basic=(c,o=1,add=false)=>new THREE.MeshBasicMaterial({color:c,transparent:o<1||add,opacity:o,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:!add,side:THREE.DoubleSide});
const Bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d), Cy=(a,b,h,s=12)=>new THREE.CylinderGeometry(a,b,h,s), Sp=r=>new THREE.SphereGeometry(r,20,16);
const mk=(p,g,m,x=0,y=0,z=0)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); p.add(o); return o; };
function cvs(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); return new THREE.CanvasTexture(c); }

/* Langit & ruang angkasa (mengikuti kamera) */
const skyG=new THREE.Group(); S.add(skyG);
const skyTex=cvs(8,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  [[0,'#02030c'],[.35,'#0b0e3c'],[.46,'#2b2a88'],[.5,'#4a3396'],[.54,'#2b2a88'],[1,'#0a0b2e']].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,24),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false,depthWrite:false}));
sky.renderOrder=-1; skyG.add(sky);
const sp=new Float32Array(1000*3);
for(let i=0;i<1000;i++){ const v=new V3(Math.random()-.5,Math.random()*.9+.04,Math.random()-.5).normalize().multiplyScalar(800); sp.set([v.x,v.y,v.z],i*3); }
const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
skyG.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,fog:false})));
const plTex=cvs(256,128,(g,w,h)=>{
  const cols=['#3b2a8f','#6a3ac2','#ff5fb0','#2b6bd6','#7f4fe0','#c04fb8','#3b2a8f'];
  cols.forEach((c,i)=>{ g.fillStyle=c; g.fillRect(0,i*h/cols.length,w,h/cols.length+1); });
});
const planet=new THREE.Mesh(new THREE.SphereGeometry(90,32,24),new THREE.MeshBasicMaterial({map:plTex,fog:false}));
planet.position.set(-250,230,-600); skyG.add(planet);
const ring=new THREE.Mesh(new THREE.RingGeometry(120,185,64),new THREE.MeshBasicMaterial({color:0xb7a5ff,transparent:true,opacity:.5,side:THREE.DoubleSide,fog:false}));
ring.rotation.set(Math.PI/2.3,0,.3); planet.add(ring);
const moon=new THREE.Mesh(Sp(25),new THREE.MeshBasicMaterial({color:0x9aa4c8,fog:false})); moon.position.set(330,340,-520); skyG.add(moon);

/* Tanah grid (mengikuti pesawat, snap per 20 unit) */
const gG=new THREE.Group(); S.add(gG);
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshStandardMaterial({color:0x0c1233,roughness:.95}));
gnd.rotation.x=-Math.PI/2; gG.add(gnd);
const grid=new THREE.GridHelper(1000,50,0x00e5ff,0x2a4fa0); grid.position.y=.08; gG.add(grid);

/* Landasan pacu */
const rwTex=cvs(128,512,(g,w,h)=>{
  g.fillStyle='#262a3a'; g.fillRect(0,0,w,h);
  g.fillStyle='#e8f4ff'; g.fillRect(6,0,6,h); g.fillRect(w-12,0,6,h);
  g.fillStyle='#ffd34a'; for(let y=0;y<h;y+=256) g.fillRect(w/2-3,y,6,128);
  g.fillStyle='#00e5ff'; g.fillRect(0,0,2,h); g.fillRect(w-2,0,2,h);
});
rwTex.wrapT=THREE.RepeatWrapping; rwTex.repeat.set(1,600/64); rwTex.anisotropy=8;
const rw=new THREE.Mesh(new THREE.PlaneGeometry(26,600),new THREE.MeshStandardMaterial({map:rwTex,roughness:.8,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}));
rw.rotation.x=-Math.PI/2; rw.position.set(0,.25,-180); S.add(rw);
const LN=62, lights=new THREE.InstancedMesh(Bx(.6,.35,.6),basic(0x00e5ff),LN), dm=new THREE.Object3D();
for(let i=0;i<LN/2;i++) [-14.5,14.5].forEach((x,j)=>{ dm.position.set(x,.45,120-i*20); dm.updateMatrix(); lights.setMatrixAt(i*2+j,dm.matrix); });
lights.frustumCulled=false; S.add(lights);

/* Menara & hangar */
const mStr=new THREE.MeshStandardMaterial({color:0x2a3354,metalness:.6,roughness:.4,flatShading:true});
const tower=new THREE.Group(); tower.position.set(-45,0,40); S.add(tower);
mk(tower,Cy(1.5,2.2,24,8),mStr,0,12,0);
mk(tower,Cy(3.6,2.6,3.2,8),new THREE.MeshStandardMaterial({color:0x00d0ff,emissive:0x0088bb,emissiveIntensity:.9,transparent:true,opacity:.85}),0,25.6,0);
mk(tower,Sp(.5),basic(0xff2bd6),0,28,0);
const hangar=new THREE.Group(); hangar.position.set(55,0,20); S.add(hangar);
mk(hangar,Bx(30,10,24),mStr,0,5,0);
mk(hangar,Bx(30.4,.35,.35),basic(0x00e5ff),0,10.1,12.1);
mk(hangar,Bx(14,7,.3),new THREE.MeshStandardMaterial({color:0x111832}),0,3.5,12.1);

/* Pylon sci-fi (tile berulang 900 unit) - posisi disimpan untuk collision */
const wrapG=new THREE.Group(); S.add(wrapG);
const PN=70, PX=[],PZ=[],PH=[],PW=[];
const pyl=new THREE.InstancedMesh(Bx(1,1,1),new THREE.MeshStandardMaterial({color:0x1a2245,metalness:.6,roughness:.4}),PN), cap=new THREE.InstancedMesh(Bx(1,1,1),basic(0xff2bd6),PN);
for(let i=0;i<PN;i++){
  let x,z; do{ x=(Math.random()-.5)*900; z=(Math.random()-.5)*900-150; }while(Math.abs(x)<70&&z>-540&&z<190);
  const h=20+Math.random()*80,w=3+Math.random()*4;
  PX.push(x); PZ.push(z); PH.push(h); PW.push(w);
  dm.position.set(x,h/2,z); dm.scale.set(w,h,w); dm.updateMatrix(); pyl.setMatrixAt(i,dm.matrix);
  dm.position.set(x,h+.6,z); dm.scale.set(w*1.15,1.2,w*1.15); dm.updateMatrix(); cap.setMatrixAt(i,dm.matrix);
}
dm.scale.set(1,1,1);
pyl.frustumCulled=false; cap.frustumCulled=false; wrapG.add(pyl,cap);

/* ---------- MODEL JET V-9 ---------- */
const mHull=new THREE.MeshStandardMaterial({color:0x56637d,metalness:.75,roughness:.3,flatShading:true});
const mDeep=new THREE.MeshStandardMaterial({color:0x232b3d,metalness:.6,roughness:.4,flatShading:true});
const mWing=new THREE.MeshStandardMaterial({color:0x7a86a3,metalness:.7,roughness:.3,flatShading:true,side:THREE.DoubleSide});
const mGlass=new THREE.MeshStandardMaterial({color:0x00d0ff,metalness:.9,roughness:.05,emissive:0x0077aa,emissiveIntensity:.8,transparent:true,opacity:.8});
const mAcc=basic(0x00e5ff), mAcc2=basic(0xff2bd6);
const GH=1.65;
const MP={hull:mHull,deep:mDeep,wing:mWing,glass:mGlass,acc:mAcc,acc2:mAcc2,f1:0x2e8bff,f2:0xe0ffff};
const matSet=(h,d,w,g,ge,a,a2,f1,f2)=>({
  hull:new THREE.MeshStandardMaterial({color:h,metalness:.75,roughness:.3,flatShading:true}),
  deep:new THREE.MeshStandardMaterial({color:d,metalness:.6,roughness:.4,flatShading:true}),
  wing:new THREE.MeshStandardMaterial({color:w,metalness:.7,roughness:.3,flatShading:true,side:THREE.DoubleSide}),
  glass:new THREE.MeshStandardMaterial({color:g,metalness:.9,roughness:.05,emissive:ge,emissiveIntensity:.8,transparent:true,opacity:.8}),
  acc:basic(a),acc2:basic(a2),f1,f2});
const ME=matSet(0x7a3b4a,0x3a1c26,0xa8586a,0xff6a2b,0xaa3300,0xff3b3b,0xffb02b,0xff7a2e,0xfff0c0); // musuh biasa (merah)
const MB=matSet(0x4a2a6a,0x1c1030,0x6a3a9a,0xff2bd6,0x990066,0xff2bd6,0xffe04a,0xff2bd6,0xfff0ff); // boss (ungu)

function slab(pts,depth){ const sh=new THREE.Shape(); pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1])); return new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false}).rotateX(Math.PI/2); }
function cone(r,L){ return new THREE.ConeGeometry(r,L,12).rotateX(-Math.PI/2).translate(0,0,-L/2); }

function makeJet(M,withGear){
  const jet=new THREE.Group(); jet.rotation.order='YXZ';

const HN=new V3(); let HD=0;
function boxT(p,r,cx,y0,y1,cz,hx,hz){
  if(p.y<y0-r||p.y>y1+r) return false;
  const dx=p.x-cx,dz=p.z-cz,ax=hx+r-Math.abs(dx),az2=hz+r-Math.abs(dz);
  if(ax<=0||az2<=0) return false;
  const up=p.y>(y0+y1)/2, ay=up?y1+r-p.y:p.y-(y0-r);
  if(ay<ax&&ay<az2){ HN.set(0,up?1:-1,0); HD=ay; }
  else if(ax<az2){ HN.set(Math.sign(dx)||1,0,0); HD=ax; }
  else{ HN.set(0,0,Math.sign(dz)||1); HD=az2; }
  return true;
}
function hitObs(p,r){
  if(boxT(p,r,55,0,10,20,15,12)) return true; // hangar
  { const dx=p.x+45,dz=p.z-40,d=Math.hypot(dx,dz),rr=p.y<24?2.6:3.8; // menara
    if(p.y<27.6+r&&d<rr+r){ HN.set(dx/(d||1),0,dz/(d||1)); HD=rr+r-d; return true; } }
  const ox=wrapG.position.x,oz=wrapG.position.z;
  for(let i=0;i<PN;i++){
    const cx=PX[i]+ox; if(Math.abs(p.x-cx)>PW[i]+r+1) continue;
    if(boxT(p,r,cx,0,PH[i]+1.2,PZ[i]+oz,PW[i]*.55,PW[i]*.55)) return true;
  }
  return false;
}
function segHit(a,b,c,r){
  const abx=b.x-a.x,aby=b.y-a.y,abz=b.z-a.z,l2=abx*abx+aby*aby+abz*abz||1e-6;
  let t=((c.x-a.x)*abx+(c.y-a.y)*aby+(c.z-a.z)*abz)/l2; t=t<0?0:t>1?1:t;
  const dx=a.x+abx*t-c.x,dy=a.y+aby*t-c.y,dz=a.z+abz*t-c.z;
  return dx*dx+dy*dy+dz*dz<r*r;
}

function updEnemy(e,dt,t){
  if(e.dead) return;
  const pp=jet.position, seen=G.stealth<=0&&!G.dead&&J.st!=='idle', B=e.boss;
  tA.copy(pp).sub(e.pos); const dist=tA.length();
  if(seen){

    else{
      tB.copy(pp).addScaledVector(fwd,J.v*Math.min(dist/450,1)*.5);

      if(dist<150){ des.negate(); des.y=des.y*.4+.3; des.addScaledVector(e.side,1); }
    }
  }else{
    e.wt-=dt;
    if(e.wt<=0){ e.wt=rnd(3,6); e.wp.set(rnd(-ARENA+300,ARENA-300),B?rnd(140,200):rnd(60,200),rnd(-ARENA+300,ARENA-300)); }
    des.copy(e.wp).sub(e.pos).normalize();
  }
  for(const o of EN){
    if(o===e) continue; sep.copy(e.pos).sub(o.pos); const d2=sep.lengthSq(), lim=B||o.boss?90000:3600;
    if(d2<lim&&d2>.01) des.addScaledVector(sep.multiplyScalar(1/Math.sqrt(d2)),.9);
  }
  if(B){ des.y*=.25; if(e.pos.y<140) des.y+=(140-e.pos.y)/30; if(e.pos.y>200) des.y-=1.2; }
  else{ if(e.pos.y<45) des.y+=(45-e.pos.y)/25; if(e.pos.y>205) des.y-=1.2; }
  if(Math.abs(e.pos.x)>ARENA-250) des.x-=Math.sign(e.pos.x)*1.6;
  if(Math.abs(e.pos.z)>ARENA-250) des.z-=Math.sign(e.pos.z)*1.6;
  if(!B){
    const look=60+e.skill*70;
    for(let k=1;k<=2;k++){
      probe.copy(e.pos).addScaledVector(e.dir,look*k*.6);
      if(hitObs(probe,14)){ des.addScaledVector(HN,3); des.y+=1; break; }
    }
  }
  des.normalize();
  e.dir.lerp(des,Math.min(1,dt*e.turn)); if(e.dir.lengthSq()<.01) e.dir.copy(des); e.dir.normalize();
  e.speed+=((seen?e.spd:e.spd*.7)-e.speed)*Math.min(1,dt*1.5);
  e.pos.addScaledVector(e.dir,e.speed*dt);
  e.g.position.copy(e.pos); tC.copy(e.pos).add(e.dir); e.g.lookAt(tC);
  const yn=Math.atan2(e.dir.x,e.dir.z), dy=wrapA(yn-e.yaw)/Math.max(dt,.001); e.yaw=yn;
  e.bk+=(clamp(-dy*.5,-1.1,1.1)-e.bk)*Math.min(1,dt*6); e.inner.rotation.z=e.bk;
  e.fl.forEach((f,i)=>f.scale.set(1,1,.8+.3*Math.sin(t*45+i*2+e.ph)));
  const sc=B?5:1;
  if(Math.random()<.4){ tG.copy(e.pos).addScaledVector(e.dir,-8*sc); emit(tG.x,tG.y,tG.z,-e.dir.x*25,-e.dir.y*25,-e.dir.z*25,1,.35,.15,.45); }
  if(B){
    // tabrakan dengan boss: pemain terpental + damage
    if(!G.dead&&dist<e.rad+6){
      const pen=e.rad+6-dist; tA.multiplyScalar(1/(dist||1));
      J.x+=tA.x*pen; J.y+=tA.y*pen; J.z+=tA.z*pen; if(J.y<GH) J.y=GH; J.v*=.7;
      if(G.hitCd<=0){ G.hitCd=.8; hurt(4000,true); shake=.9; spark(pp,16,[1,.5,.1]); toast('💥 Menabrak Boss!'); }
    }
  }else{
    if(hitObs(e.pos,4.5)||e.pos.y<3){ killEnemy(e,false); return; }
    if(!G.dead&&dist<9){ hurt(3000,true); shake=.8; killEnemy(e,true); return; }
    // laser musuh biasa (ringan). Boss tidak memakai laser: senjatanya hanya 2 rudal pelacak.
    e.cd-=dt;
    if(seen&&dist<650&&e.cd<=0){
      tB.copy(pp).addScaledVector(fwd,J.v*dist/450).sub(e.pos).normalize();
      if(tB.dot(e.dir)>.93){
        tB.x+=rnd(-.035,.035); tB.y+=rnd(-.035,.035); tB.z+=rnd(-.035,.035); tB.normalize();
        tG.copy(e.pos).addScaledVector(e.dir,8);

      }

  if(B){ e.mcd-=dt; if(seen&&e.mcd<=0&&dist<1500){ bossMissile(e); e.mcd=BOSS_CD; } }

function simBullets(dt){
  for(const b of bolts){
    if(!b.m.visible) continue;
    prevP.copy(b.m.position); nextP.copy(prevP).addScaledVector(b.v,dt); b.life-=dt;
    let hit=false;
    for(const e of EN){ if(segHit(prevP,nextP,e.pos,e.rad)){ dmgEnemy(e,25); hit=true; break; } }
    if(!hit&&(nextP.y<0||hitObs(nextP,.6))){ spark(nextP,5,[1,.6,.3]); hit=true; }
    if(hit||b.life<=0) b.m.visible=false; else b.m.position.copy(nextP);
  }
  for(const b of EB){
    if(!b.m.visible) continue;
    prevP.copy(b.m.position); nextP.copy(prevP).addScaledVector(b.v,dt); b.life-=dt;
    let hit=false;
    if(!G.dead&&G.stealth<=0&&G.invul<=0&&segHit(prevP,nextP,jet.position,5)){ hurt(b.dmg); spark(jet.position,6,[1,.3,.2]); hit=true; }
    if(!hit&&(nextP.y<0||hitObs(nextP,1.2))){ spark(nextP,4,[1,.5,.3]); hit=true; }
    if(hit||b.life<=0) b.m.visible=false; else b.m.position.copy(nextP);
  }
}
function simMissiles(dt){
  for(let i=MS.length-1;i>=0;i--){
    const s=MS[i]; s.age+=dt; s.life-=dt;
    if(s.target&&s.target.dead) s.target=null;
    if(!s.target&&s.age>.3){
      let best=null,bs=-9;
      for(const e of EN){ tL.copy(e.pos).sub(s.pos); const d=tL.length(); if(d>1600) continue; const sc=tL.multiplyScalar(1/d).dot(s.dir)-d/3200; if(sc>.2&&sc>bs){ bs=sc; best=e; } }
      s.target=best;
    }
    if(s.target&&s.age>.2){ tL.copy(s.target.pos).sub(s.pos).normalize(); s.dir.lerp(tL,Math.min(1,dt*3.2)).normalize(); }
    s.speed=Math.min(420,s.speed+260*dt);
    s.pos.addScaledVector(s.dir,s.speed*dt);
    s.m.position.copy(s.pos); tC.copy(s.pos).add(s.dir); s.m.lookAt(tC);
    emit(s.pos.x-s.dir.x*2,s.pos.y-s.dir.y*2,s.pos.z-s.dir.z*2,rnd(-6,6),rnd(-6,6),rnd(-6,6),1,.7,.3,.6);
    let boom=s.life<=0||s.pos.y<1||hitObs(s.pos,2.5);
    if(!boom) for(const e of EN){ const rr=e.rad+3; if(e.pos.distanceToSquared(s.pos)<rr*rr){ boom=true; break; } }
    if(boom){
      explode(s.pos,1); sfx.boom(dV(s.pos));

      S.remove(s.m); MS.splice(i,1);
    }
  }
}

function simPlayer(dt,t){
  az+=st.cam*1.8*dt;
  G.missCd=Math.max(0,G.missCd-dt);
  if(G.stealth>0){ G.stealth=Math.max(0,G.stealth-dt); if(G.stealth===0) G.stealthCd=1.0; }  // cooldown stealth 1.0 dtk
  else G.stealthCd=Math.max(0,G.stealthCd-dt);
  G.rollCd=Math.max(0,G.rollCd-dt); G.jbCd=Math.max(0,G.jbCd-dt);
  G.invul=Math.max(0,G.invul-dt); G.hitCd=Math.max(0,G.hitCd-dt); G.warnT=Math.max(0,G.warnT-dt);
  const k=st.k, ix=k.r-k.l, iy=k.u-k.d;
  let jbRoll=0;
  J.eng+=((J.engOn?1:0)-J.eng)*Math.min(1,dt*.7);
  const air=J.st==='air'||J.st==='landing';
  if(G.en<=0) G.tired=true; if(G.en>25) G.tired=false;
  G.boost=st.boost&&air&&!G.tired&&G.en>0&&G.jbT<0;
  if(G.boost){ G.en=Math.max(0,G.en-30*dt); if(!G.wasB) sfx.boost(); } else G.en=Math.min(100,G.en+15*dt);
  G.wasB=G.boost;

  if(!air){
    let pt=0;
    if(J.st==='roll'){
      J.v=Math.min(VMAX,J.v+15*dt*(.3+J.eng*.7));
      if(J.v>38) pt=.1;
      if(J.v>50){ J.p=.34; setState('air'); }
    } else if(J.st==='rollout'){
      J.v=Math.max(0,J.v-18*dt);
      if(J.v<.3){ J.v=0; J.engOn=false; setState('idle'); }
    }
    J.h-=ix*.7*Math.min(1,J.v/25)*dt;
    J.y=GH; J.p+=(pt-J.p)*Math.min(1,dt*6); J.r+=(0-J.r)*Math.min(1,dt*6);
    J.x+=Math.sin(J.h)*J.v*dt; J.z+=Math.cos(J.h)*J.v*dt;
  } else {
    const alt=J.y-GH, landing=J.st==='landing';
    let tgt=landing?44:VMAX*(G.boost?1.9:1), rate=G.boost?1.6:.7, ixx=ix;
    if(G.jbT>=0){   // JUMPING BACK: maju cepat, lalu berbalik 180° mulus
      G.jbT+=dt; G.invul=Math.max(G.invul,.12); ixx=0;
      if(G.jbT<.55){ tgt=VMAX*2.5; rate=5; } else { tgt=VMAX*.8; rate=2; }
    }
    J.v+=(tgt-J.v)*Math.min(1,dt*rate);
    let pt=0;
    if(landing) pt=alt>60?-.22:alt>14?-.1:alt>3.5?-.05:-.03;
    if(iy) J.p+=iy*1.0*dt; else J.p+=(pt-J.p)*Math.min(1,dt*1.4);
    J.p=clamp(J.p,-.85,.85);
    J.r+=(ixx*.95-J.r)*Math.min(1,dt*3.5);
    J.h-=Math.sin(J.r)*1.1*dt;
    if(G.jbT>=.55){
      if(G.jbH0===null) G.jbH0=J.h;
      const u=Math.min(1,(G.jbT-.55)/1.1), s=u*u*(3-2*u);
      J.h=G.jbH0+G.jbDir*Math.PI*s;
      jbRoll=-G.jbDir*Math.sin(Math.PI*u)*1.1;
      if(u>=1){ G.jbT=-1; G.jbH0=null; }
    }
    const cp=Math.cos(J.p);
    J.x+=Math.sin(J.h)*cp*J.v*dt; J.z+=Math.cos(J.h)*cp*J.v*dt; J.y+=Math.sin(J.p)*J.v*dt;
    if(J.y<=GH){
      J.y=GH;
      if(landing){ J.p=0; J.r=0; setState('rollout'); } else if(J.p<0) J.p=0;
    }
    if(J.y>220){ J.y=220; if(J.p>0) J.p=0; }
  }
  // batas arena (diperluas)
  const L=ARENA-60;
  if(Math.abs(J.x)>L||Math.abs(J.z)>L){
    J.x=clamp(J.x,-L,L); J.z=clamp(J.z,-L,L); J.v*=.985;
    if(G.warnT<=0){ toast('⚠ BATAS AREA - belok kembali!'); G.warnT=2; }
  }else if((Math.abs(J.x)>ARENA-350||Math.abs(J.z)>ARENA-350)&&G.warnT<=0){ toast('⚠ Mendekati batas area'); G.warnT=3; }
  // tabrakan rintangan
  jetPos.set(J.x,J.y,J.z);
  if(hitObs(jetPos,3)){
    J.x+=HN.x*(HD+.5); J.y+=HN.y*(HD+.5); J.z+=HN.z*(HD+.5); if(J.y<GH) J.y=GH; J.v*=.5;
    if(G.hitCd<=0){
      G.hitCd=.8; hurt(2500,true); spark(jetPos,22,[1,.5,.1]); explode(jetPos,.4); shake=1; sfx.boom(.6); toast('💥 Menabrak rintangan!');
    }
  }

  let ra=0;

    G.rollT+=dt/.9; G.invul=Math.max(G.invul,.12);
    if(G.rollT>=1) G.rollT=-1; else{ const q=G.rollT; ra=q*q*(3-2*q)*Math.PI*2*G.rollDir; }
  }
  jet.position.set(J.x,J.y,J.z);
  jet.rotation.set(-J.p,J.h,J.r+ra+jbRoll);
  const cp2=Math.cos(J.p); fwd.set(Math.sin(J.h)*cp2,Math.sin(J.p),Math.cos(J.h)*cp2);
  const alt=J.y-GH, spd=clamp(J.v/VMAX,0,1);

  const bst=clamp((J.v-VMAX)/VMAX,0,1);
  const thr=J.eng*(air?(J.st==='landing'?.55:1):(J.st==='roll'?1:.25));
  flames.forEach((f,i)=>{
    f.visible=thr>.04;
    const l=thr*(1+bst*.9)*(.8+.35*Math.sin(t*50+i*2)+.2*Math.sin(t*31+i));
    f.scale.set(1+.1*Math.sin(t*40+i),1+.1*Math.cos(t*37+i),Math.max(.05,l));
  });
  eL.intensity=thr*(2.2+Math.sin(t*35));
  engUpdate(J.eng,spd);
  if((G.boost||G.jbT>=0&&G.jbT<.55)&&Math.random()<.6){ tG.copy(jet.position).addScaledVector(fwd,-7); emit(tG.x,tG.y,tG.z,-fwd.x*60,-fwd.y*60,-fwd.z*60,1,.3,.9,.5); }
  setStealthVisual(G.stealth>0,t);

  fireCd-=dt;
  if(st.fire&&fireCd<=0){ fireCd=.11; shoot(side?muzR:muzL); side^=1; sfxLaser(); }

  blobG.position.set(J.x,.35,J.z); blobG.rotation.y=J.h; blobG.visible=alt<160;
  const sc=1+alt*.04; blob.scale.set(5.5*sc,6.5*sc,1); blob.material.opacity=.5/(1+alt*.05);
}

function drawRadar(){
  const S2=200,c=100,sc=(c-6)/RR; rx.clearRect(0,0,S2,S2);
  rx.save(); rx.beginPath(); rx.arc(c,c,c-1,0,6.283); rx.clip();
  rx.fillStyle='rgba(5,8,30,.82)'; rx.fillRect(0,0,S2,S2);
  const sy=Math.sin(J.h),cy2=Math.cos(J.h);
  const tr=(x,z)=>{ const dx=x-J.x,dz=z-J.z; return[c+(-cy2*dx+sy*dz)*sc,c-(sy*dx+cy2*dz)*sc]; };
  rx.strokeStyle='rgba(0,229,255,.3)'; rx.lineWidth=1;
  [.33,.66,1].forEach(q=>{ rx.beginPath(); rx.arc(c,c,(c-6)*q,0,6.283); rx.stroke(); });
  rx.beginPath(); rx.moveTo(c,0); rx.lineTo(c,S2); rx.moveTo(0,c); rx.lineTo(S2,c); rx.stroke();
  rx.strokeStyle='#ff2bd6'; rx.lineWidth=3; rx.beginPath();
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach((q,i)=>{ const p=tr(q[0]*ARENA,q[1]*ARENA); i?rx.lineTo(p[0],p[1]):rx.moveTo(p[0],p[1]); });
  rx.closePath(); rx.stroke();
  const ox=wrapG.position.x,oz=wrapG.position.z; rx.fillStyle='#ffb02b';
  for(let i=0;i<PN;i++){ const p=tr(PX[i]+ox,PZ[i]+oz); if(Math.hypot(p[0]-c,p[1]-c)>c+6) continue; const r=Math.max(2.5,PW[i]*sc); rx.fillRect(p[0]-r,p[1]-r,r*2,r*2); }
  rx.fillStyle='#00c8ff'; { const p=tr(55,20); rx.fillRect(p[0]-15*sc,p[1]-12*sc,30*sc,24*sc); const q=tr(-45,40); rx.beginPath(); rx.arc(q[0],q[1],3,0,6.283); rx.fill(); }
  for(const e of EN){
    const p=tr(e.pos.x,e.pos.z), d=Math.hypot(p[0]-c,p[1]-c), m=c-8;
    if(d>m){ p[0]=c+(p[0]-c)*m/d; p[1]=c+(p[1]-c)*m/d; }
    rx.fillStyle=e.boss?'#ff2bd6':e===lockT?'#ffe45c':'#ff3b3b'; rx.beginPath(); rx.arc(p[0],p[1],e.boss?8:e===lockT?6:4.5,0,6.283); rx.fill();
  }
  rx.fillStyle='#ffa02b';
  for(const s of EM){
    const p=tr(s.pos.x,s.pos.z), d=Math.hypot(p[0]-c,p[1]-c), m=c-8;
    if(d>m){ p[0]=c+(p[0]-c)*m/d; p[1]=c+(p[1]-c)*m/d; }
    rx.fillRect(p[0]-3,p[1]-3,6,6);
  }
  rx.fillStyle=G.stealth>0?'#7fffd0':'#ffffff'; rx.beginPath(); rx.moveTo(c,c-11); rx.lineTo(c-7,c+8); rx.lineTo(c+7,c+8); rx.closePath(); rx.fill();
  rx.restore();
}

/* ---------- MARKER LAYAR ---------- */
function drawMarkers(){
  const w=innerWidth,h=innerHeight; mx.clearRect(0,0,w,h);
  if(!G.on||G.dead) return;
  lockT=pickTargets(1)[0]||null;
  T1.copy(jet.position).addScaledVector(fwd,500).project(cam);
  if(T1.z<1){
    const x=(T1.x*.5+.5)*w,y=(-T1.y*.5+.5)*h;
    mx.strokeStyle='rgba(0,240,255,.9)'; mx.lineWidth=1.5; mx.beginPath(); mx.arc(x,y,10,0,6.283);
    mx.moveTo(x-16,y); mx.lineTo(x-6,y); mx.moveTo(x+6,y); mx.lineTo(x+16,y); mx.stroke();
  }
  for(const e of EN){
    T1.copy(e.pos).project(cam);
    const behind=T1.z>1; let sx=(T1.x*.5+.5)*w, sy=(-T1.y*.5+.5)*h;
    if(behind){ sx=w-sx; sy=h-sy; }
    const col=e.boss?'#ff2bd6':e===lockT?'#ffe45c':'#ff3b3b';
    if(!behind&&sx>0&&sx<w&&sy>0&&sy<h){
      const d=e.pos.distanceTo(jet.position), s=clamp(1000/d,10,32)*(e.boss?1.8:1);
      mx.strokeStyle=col; mx.lineWidth=2; mx.beginPath();
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(q=>{ mx.moveTo(sx+q[0]*s,sy+q[1]*s*.6); mx.lineTo(sx+q[0]*s,sy+q[1]*s); mx.lineTo(sx+q[0]*s*.55,sy+q[1]*s); });
      mx.stroke();
      mx.fillStyle='rgba(0,0,0,.6)'; mx.fillRect(sx-s,sy+s+4,s*2,4);
      mx.fillStyle=col; mx.fillRect(sx-s,sy+s+4,s*2*clamp(e.hp/e.max,0,1),4);
      mx.font='10px monospace'; mx.textAlign='center'; mx.fillText((e.boss?'BOSS ':'')+Math.round(d)+'m',sx,sy+s+18);
    }else{
      const ang=Math.atan2(sy-h/2,sx-w/2), co=Math.cos(ang)||1e-6, si=Math.sin(ang)||1e-6;
      const tt=Math.min((w/2-24)/Math.abs(co),(h/2-24)/Math.abs(si));
      mx.save(); mx.translate(w/2+co*tt,h/2+si*tt); mx.rotate(ang); mx.fillStyle=col;
      mx.beginPath(); mx.moveTo(12,0); mx.lineTo(-8,-8); mx.lineTo(-8,8); mx.closePath(); mx.fill(); mx.restore();
    }
  }
  for(const s of EM){   // penanda rudal boss
    T1.copy(s.pos).project(cam);
    if(T1.z<1){ const x=(T1.x*.5+.5)*w,y=(-T1.y*.5+.5)*h; mx.strokeStyle='#ffa02b'; mx.lineWidth=2; mx.beginPath(); mx.arc(x,y,14,0,6.283); mx.stroke(); mx.fillStyle='#ffa02b'; mx.font='10px monospace'; mx.textAlign='center'; mx.fillText('RUDAL',x,y-18); }
  }
}

/* ---------- HUD ---------- */
const eHpt=$('hpt'),eHpb=$('hpb'),eShw=$('shw'),eShb=$('shb'),eEnb=$('enb'),eInf=$('inf'),eFl=$('fl');
const bMs=$('bMs'),bSt=$('bSt'),bRl=$('bRl'),bBs=$('bBs'),bJb=$('bJb'),cMs=$('cMs'),cSt=$('cSt'),cRl=$('cRl'),cJb=$('cJb');
function updHud(){
  eHpt.textContent=fmt(G.hp)+' / '+fmt(G.max);
  eHpb.style.width=clamp(G.hp/G.max*100,0,100)+'%';
  eShw.style.display=G.sh>0?'block':'none'; eShb.style.width=clamp(G.sh/G.shMax*100,0,100)+'%';
  eEnb.style.width=G.en+'%'; eEnb.style.opacity=G.tired?.45:1;
  const bo=EN.find(e=>e.boss);
  eInf.textContent='WAVE '+(G.wave||'-')+' · SISA '+fmt(EN.length+G.toSpawn+G.bossLeft)+'\nSKOR '+fmt(G.score)+' · KILL '+fmt(G.kills)+'\nRUDAL '+fmt(missDmg())+' ×'+G.missN+
    (bo?'\nBOSS '+fmt(bo.hp)+' / '+fmt(bo.max)+'\nRUDAL BOSS 2×'+fmt(bo.mdmg)+' · '+Math.max(0,Math.ceil(bo.mcd))+'s':'');
  bMs.classList.toggle('cd',G.missCd>0); cMs.textContent=G.missCd>0?G.missCd.toFixed(1):'';
  bSt.classList.toggle('act2',G.stealth>0); bSt.classList.toggle('cd',G.stealth<=0&&G.stealthCd>0);
  cSt.textContent=G.stealth>0?Math.ceil(G.stealth):G.stealthCd>0?G.stealthCd.toFixed(1):'';
  bRl.classList.toggle('cd',G.rollCd>0); cRl.textContent=G.rollCd>0?G.rollCd.toFixed(1):'';
  bJb.classList.toggle('cd',G.jbCd>0&&G.jbT<0); bJb.classList.toggle('act2',G.jbT>=0); cJb.textContent=G.jbCd>0?Math.ceil(G.jbCd):'';
  bBs.classList.toggle('cd',G.tired);
}
banner('JET TEMPUR V-9','Tekan TAKE OFF untuk lepas landas dan memulai Wave 1');

/* ---------- LOOP ---------- */
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(G.paused){
    G.bt-=dt; $('bt').textContent=Math.max(0,Math.ceil(G.bt));
    if(G.bt<=0) applyBuff(Math.random()<.5?'m':'h');
  }else{
    if(!G.dead) simPlayer(dt,t);
    if(!G.on&&J.st==='air'&&!G.dead){ G.on=true; startWave(1); }
    if(G.on&&!G.dead){ for(const e of EN.slice()) updEnemy(e,dt,t); simWave(dt); }
    simBullets(dt); simMissiles(dt); simBossMissiles(dt);
  }
  if(G.dead) blobG.visible=false;
  updP(dt);
  camera(dt);
  const alt=J.y-GH;

  skyG.position.copy(cam.position);
  gG.position.set(Math.round(J.x/20)*20,0,Math.round(J.z/20)*20);
  wrapG.position.set(Math.round(J.x/900)*900,0,Math.round(J.z/900)*900);

  flash=Math.max(0,flash-dt*2); eFl.style.opacity=flash;
  hudT-=dt;
  if(hudT<=0){ hudT=.1; $('sp').textContent=Math.round(J.v*10); $('al').textContent=Math.round(alt); updHud(); }
  R.render(S,cam);
  drawMarkers(); drawRadar();
}
tick();
</script>
