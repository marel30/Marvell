<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Iron Man Mark V Simulator</title>
<style>
:root{--b:min(12vw,50px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#07121f;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:10px;left:0;right:0;text-align:center;color:#6ff;font:700 13px monospace;letter-spacing:2px;text-shadow:0 0 8px #0ff;pointer-events:none}
#hud{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad,.act{display:grid;gap:5px;pointer-events:auto}
.pad{grid-template-columns:repeat(3,var(--b))}
.act{grid-template-columns:repeat(3,calc(var(--b)*1.3))}
button{height:var(--b);border:1px solid #0ff8;border-radius:10px;background:rgba(10,30,50,.7);color:#9ff;font:700 11px sans-serif;box-shadow:0 0 8px #0ff4 inset;padding:0}
button:active,button.on{background:rgba(0,220,255,.45);color:#fff}
.wide{grid-column:span 2}
#laser{color:#fff;border-color:#f66}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">MARK V • <span id="st">SIAGA</span> • <span id="an">Classic</span></div>
<div id="flash"></div>
<div id="hud">
  <div class="pad">
    <i></i><button data-d="u">▲</button><i></i>
    <button data-d="l">◀</button><i></i><button data-d="r">▶</button>
    <i></i><button data-d="d">▼</button><i></i>
  </div>
  <div class="act">
    <button id="laser">LASER</button><button id="bSiaga" class="on">SIAGA</button><button id="bFly">TERBANG</button>
    <button id="bSnap">JENTIK ✨</button><button id="bArm" class="wide">ARMOR</button>
    <button id="cL">KAM &lt;</button><button id="cRs">RESET</button><button id="cR">KAM &gt;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), V3=THREE.Vector3;

/* ---------- AUDIO (Web Audio API, sintetis) ---------- */
let ac,hum;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function tone(type,f1,f2,dur,vol,delay=0){
  const a=audio(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noiseBuf(a,sec){ const b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function sfxLaser(){ tone('sawtooth',1500,160,.4,.28); tone('square',700,90,.3,.12); }
function sfxSnap(){
  const a=audio(),t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf(a,.1); f.type='highpass'; f.frequency.value=2500;
  g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
  tone('triangle',900,1800,.9,.2,.1); tone('sine',1320,2640,1.1,.12,.12);
}
function setHum(on){
  const a=audio();
  if(!hum){
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=noiseBuf(a,2); s.loop=true; f.type='lowpass'; f.frequency.value=500; g.gain.value=0;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(); hum=g;
  }
  hum.gain.setTargetAtTime(on?.18:0,a.currentTime,.25);
}

/* ---------- SCENE ---------- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(); S.background=new THREE.Color(0x10243d); S.fog=new THREE.Fog(0x10243d,35,80);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
function rs(){ R.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize',rs); rs();

/* Pencahayaan terang */
S.add(new THREE.AmbientLight(0xffffff,.9));
S.add(new THREE.HemisphereLight(0xbfe6ff,0x445566,.6));
const sun=new THREE.DirectionalLight(0xffffff,1.3); sun.position.set(6,12,8); S.add(sun);
const fill=new THREE.DirectionalLight(0xaad4ff,.7); fill.position.set(-8,5,-6); S.add(fill);

const gnd=new THREE.Mesh(new THREE.CircleGeometry(45,48),new THREE.MeshStandardMaterial({color:0x1c2f47,roughness:.9}));
gnd.rotation.x=-Math.PI/2; S.add(gnd);
const grid=new THREE.GridHelper(90,45,0x00e5ff,0x2a5a7a); grid.position.y=.02; S.add(grid);
const blob=new THREE.Mesh(new THREE.CircleGeometry(1.3,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.45}));
blob.rotation.x=-Math.PI/2; blob.position.y=.04; S.add(blob);

/* ---------- MODEL ---------- */
const mMain=new THREE.MeshStandardMaterial({color:0xb3121a,metalness:.6,roughness:.3});
const mTrim=new THREE.MeshStandardMaterial({color:0xffc233,metalness:.7,roughness:.25});
const mDark=new THREE.MeshStandardMaterial({color:0x333a44,metalness:.5,roughness:.5});
const basic=(c,o=1,add=false)=>new THREE.MeshBasicMaterial({color:c,transparent:o<1||add,opacity:o,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:!add,side:THREE.DoubleSide});
const Bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d), Cy=(a,b,h,s=16)=>new THREE.CylinderGeometry(a,b,h,s), Sp=r=>new THREE.SphereGeometry(r,20,16);
const put=(p,g,m,x=0,y=0,z=0)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); p.add(o); return o; };

const iron=new THREE.Group(); S.add(iron);
const body=new THREE.Group(); iron.add(body);

// Torso
put(body,Bx(1.2,.5,.8),mTrim,0,2.6,0);
put(body,Bx(1.3,.7,.8),mTrim,0,3.15,0);
put(body,Bx(2.1,1.6,1.1),mMain,0,4.2,0);
put(body,Cy(.3,.35,.3),mDark,0,5.1,0);
// Reaktor dada
put(body,new THREE.TorusGeometry(.38,.08,12,24),mTrim,0,4.3,.56);
put(body,Cy(.3,.3,.08,24),basic(0x9ffcff),0,4.3,.57).rotation.x=Math.PI/2;
const rl=new THREE.PointLight(0x66f0ff,1.2,6); rl.position.set(0,4.3,1.1); body.add(rl);

// Kepala
const head=new THREE.Group(); head.position.set(0,5.55,0); body.add(head);
put(head,Sp(.55),mMain).scale.set(1,1.15,1.05);
put(head,Bx(.7,.85,.12),mTrim,0,-.02,.56);
put(head,Bx(.2,.07,.05),basic(0xdffcff),-.2,.12,.63);
put(head,Bx(.2,.07,.05),basic(0xdffcff),.2,.12,.63);

// Lengan (s=+1 kiri robot, s=-1 kanan robot; robot menghadap +Z)
function makeArm(s){
  const g=new THREE.Group(); g.position.set(s*1.4,4.55,0); body.add(g);
  put(g,Sp(.48),mMain);
  put(g,Cy(.28,.25,1.0),mMain,0,-.75,0);
  put(g,Sp(.27),mTrim,0,-1.3,0);
  put(g,Cy(.27,.22,1.0),mTrim,0,-1.85,0);
  put(g,Sp(.27),mMain,0,-2.45,0);
  return g;
}
const rArm=makeArm(-1), lArm=makeArm(1);

// Repulsor telapak tangan kanan + laser
put(rArm,Cy(.2,.2,.06,20),basic(0x9ffcff),0,-2.66,0);
const palmL=new THREE.PointLight(0x00e5ff,.3,5); palmL.position.set(0,-2.8,0); rArm.add(palmL);
const LEN=18;
const g1=new THREE.CylinderGeometry(.07,.07,LEN,10); g1.translate(0,-LEN/2,0);
const g2=new THREE.CylinderGeometry(.2,.2,LEN,14,1,true); g2.translate(0,-LEN/2,0);
const beam=new THREE.Group(); beam.position.set(0,-2.7,0); rArm.add(beam); // sumbu lokal -Y = searah lengan
beam.add(new THREE.Mesh(g1,basic(0xffffff)));
const outer=new THREE.Mesh(g2,basic(0x00e5ff,.55,true)); beam.add(outer);
const flare=put(beam,Sp(.38),basic(0x00e5ff,.8,true));
beam.visible=false;

// Nano Gauntlet + Infinity Stones (kiri)
put(lArm,Bx(.75,1.0,.7),mTrim,0,-1.9,0);
const stones=[0xffe600,0x2f7bff,0xff2020,0xb04bff,0x2cff4a,0xff8a00].map((c,i)=>
  put(lArm,Sp(.1),basic(c),(i%3-1)*.2,-1.62-Math.floor(i/3)*.3,.38));
const snapL=new THREE.PointLight(0xffffff,0,10); snapL.position.set(0,-2.6,.4); lArm.add(snapL);

// Kaki + api pendorong
const legs=[],flames=[];
[-1,1].forEach(s=>{
  const g=new THREE.Group(); g.position.set(s*.5,2.5,0); body.add(g); legs.push(g);
  put(g,Bx(.55,1.0,.6),mMain,0,-.55,0);
  put(g,Sp(.3),mTrim,0,-1.1,0);
  put(g,Bx(.5,1.1,.55),mTrim,0,-1.65,0);
  put(g,Bx(.6,.25,1.0),mMain,0,-2.37,.2);
  const f=new THREE.Group(); f.position.set(0,-2.5,.2); g.add(f);
  const c1=new THREE.ConeGeometry(.32,2.2,14); c1.rotateX(Math.PI); c1.translate(0,-1.1,0);
  const c2=new THREE.ConeGeometry(.17,1.4,12); c2.rotateX(Math.PI); c2.translate(0,-.7,0);
  f.add(new THREE.Mesh(c1,basic(0xff7a00,.8,true)));
  f.add(new THREE.Mesh(c2,basic(0xbff6ff,.95,true)));
  f.visible=false; flames.push(f);
});
const flameL=new THREE.PointLight(0xff8a00,0,9); flameL.position.set(0,.3,0); iron.add(flameL);

/* ---------- PARTIKEL JENTIK ---------- */
const N=140,pp=new Float32Array(N*3),pv=new Float32Array(N*3),pc=new Float32Array(N*3);
for(let i=0;i<N;i++) pp[i*3+1]=-100;
const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.25,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
pts.frustumCulled=false; S.add(pts);
const cols=[0xffe600,0x2f7bff,0xff2020,0xb04bff,0x2cff4a,0xff8a00];
function burst(p){
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    const v=new V3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*5);
    pp.set([p.x,p.y,p.z],i*3); pv.set([v.x,v.y,v.z],i*3);
    c.setHex(cols[i%6]); pc.set([c.r,c.g,c.b],i*3);
  }
}

/* ---------- STATE & KONTROL ---------- */
const st={fly:false,hold:false,fireT:0,snap:-1,snapDone:false,az:.6,cam:0,armor:0,k:{u:0,d:0,l:0,r:0}};
const armors=[
  {n:'Classic',m:0xb3121a,t:0xffc233},
  {n:'Hot Rod',m:0x7a0a0a,t:0xff9d00},
  {n:'Stealth',m:0x1b1f27,t:0x7b8594},
  {n:'Ice Blue',m:0x1e5bff,t:0xe8f2ff},
  {n:'Silver Centurion',m:0xc5ccd6,t:0xb3121a}
];
function setArmor(){ const a=armors[st.armor]; mMain.color.setHex(a.m); mTrim.color.setHex(a.t); $('an').textContent=a.n; }

function bind(el,down,up){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); audio(); down&&down(); });
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>up&&up()));
}
function setMode(fly){
  st.fly=fly; setHum(fly);
  $('st').textContent=fly?'TERBANG':'SIAGA';
  $('bFly').classList.toggle('on',fly); $('bSiaga').classList.toggle('on',!fly);
}
bind($('laser'),()=>{ st.hold=true; st.fireT=.8; pew=0; },()=>{ st.hold=false; });
bind($('bSiaga'),()=>setMode(false));
bind($('bFly'),()=>setMode(true));
bind($('bSnap'),()=>{ if(st.snap<0){ st.snap=0; st.snapDone=false; } });
bind($('bArm'),()=>{ st.armor=(st.armor+1)%armors.length; setArmor(); tone('sine',500,900,.15,.15); });
bind($('cL'),()=>st.cam=-1,()=>{ if(st.cam<0) st.cam=0; });
bind($('cR'),()=>st.cam=1,()=>{ if(st.cam>0) st.cam=0; });
bind($('cRs'),()=>{ st.az=.6; });
document.querySelectorAll('[data-d]').forEach(b=>bind(b,()=>st.k[b.dataset.d]=1,()=>st.k[b.dataset.d]=0));

// Geser layar untuk memutar kamera
let dragX=null;
const cv=$('c');
cv.addEventListener('pointerdown',e=>dragX=e.clientX);
cv.addEventListener('pointermove',e=>{ if(dragX!==null){ st.az-=(e.clientX-dragX)*.008; dragX=e.clientX; } });
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>dragX=null));

/* ---------- LOOP ---------- */
const clock=new THREE.Clock(), ct=new V3(0,2.2,0);
let pew=0, flashV=0, flameAmt=0;
const lerp=(o,k,v,dt,sp=10)=>{ o[k]+=(v-o[k])*Math.min(1,dt*sp); };
setArmor();

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  st.az+=st.cam*1.8*dt;

  // Gerak D-pad (relatif kamera)
  const k=st.k, ix=k.r-k.l, iz=k.u-k.d; let mv=0;
  if(ix||iz){
    const f=new V3(-Math.sin(st.az),0,-Math.cos(st.az)), r=new V3(Math.cos(st.az),0,-Math.sin(st.az));
    const d=f.multiplyScalar(iz).add(r.multiplyScalar(ix)).normalize();
    iron.position.addScaledVector(d,(st.fly?7:4)*dt);
    const L=Math.hypot(iron.position.x,iron.position.z); if(L>35) iron.position.multiplyScalar(35/L);
    let dy=Math.atan2(d.x,d.z)-iron.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
    iron.rotation.y+=dy*Math.min(1,dt*8); mv=1;
  }
  // Terbang / siaga
  const ty=st.fly?2.2+Math.sin(t*2)*.15:0;
  iron.position.y+=(ty-iron.position.y)*Math.min(1,dt*3);
  lerp(body.rotation,'x',st.fly?(mv?.5:.12):0,dt,5);
  legs.forEach(l=>lerp(l.rotation,'x',st.fly?.25:0,dt,5));

  // Api pendorong
  flameAmt+=((st.fly?1:0)-flameAmt)*Math.min(1,dt*6);
  flames.forEach((f,i)=>{
    f.visible=flameAmt>.03;
    const p=1+.3*Math.sin(t*40+i*2)+.2*Math.sin(t*23+i);
    f.scale.set(1+.1*Math.sin(t*35),flameAmt*p,1+.1*Math.sin(t*35));
  });
  flameL.intensity=flameAmt*(2+Math.sin(t*30));

  // Laser dari telapak kanan, lengan terangkat lurus ke depan
  st.fireT-=dt;
  const fire=st.hold||st.fireT>0;
  lerp(rArm.rotation,'x',fire?-Math.PI/2:(st.fly?.35:.05),dt,12);
  lerp(rArm.rotation,'z',fire?0:-.12,dt,12);
  const up=rArm.rotation.x<-1.3;
  beam.visible=fire&&up;
  palmL.intensity=beam.visible?2.5:.3;
  if(beam.visible){
    const w=1+Math.sin(t*60)*.15; outer.scale.set(w,1,w);
    flare.scale.setScalar(1+Math.sin(t*50)*.25);
    pew-=dt; if(pew<=0){ sfxLaser(); pew=.28; }
  }

  // Jentik (Nano Gauntlet kiri)
  if(st.snap>=0){
    st.snap+=dt;
    if(!st.snapDone&&st.snap>.55){
      st.snapDone=true; sfxSnap();
      burst(lArm.localToWorld(new V3(0,-2.6,.3)));
      flashV=.7; snapL.intensity=6;
    }
    if(st.snap>1.9) st.snap=-1;
  }
  const sn=st.snap>=0&&st.snap<1.5;
  lerp(lArm.rotation,'x',sn?-1.2:.05,dt,10);
  lerp(lArm.rotation,'z',sn?0:.12,dt,10);
  snapL.intensity*=Math.pow(.02,dt);
  stones.forEach((s,i)=>s.scale.setScalar(1+.25*Math.sin(t*4+i)+(snapL.intensity>.2?snapL.intensity*.2:0)));
  flashV=Math.max(0,flashV-dt*2.2); $('flash').style.opacity=flashV;

  // Partikel
  for(let i=0;i<N;i++){
    const j=i*3;
    if(pp[j+1]>-50){
      pp[j]+=pv[j]*dt; pp[j+1]+=pv[j+1]*dt; pp[j+2]+=pv[j+2]*dt;
      pv[j]*=.97; pv[j+1]=pv[j+1]*.97-1.5*dt; pv[j+2]*=.97;
      const fd=1-dt*1.2; pc[j]*=fd; pc[j+1]*=fd; pc[j+2]*=fd;
      if(pc[j]+pc[j+1]+pc[j+2]<.05) pp[j+1]=-100;
    }
  }
  pg.attributes.position.needsUpdate=true; pg.attributes.color.needsUpdate=true;

  // Bayangan & kamera
  blob.position.x=iron.position.x; blob.position.z=iron.position.z;
  blob.scale.setScalar(1/(1+iron.position.y*.25)); blob.material.opacity=.45/(1+iron.position.y*.3);
  ct.lerp(new V3(iron.position.x,2.2+iron.position.y*.5,iron.position.z),Math.min(1,dt*5));
  cam.position.set(ct.x+Math.sin(st.az)*16,ct.y+3,ct.z+Math.cos(st.az)*16);
  cam.lookAt(ct);
  R.render(S,cam);
}
tick();
</script>
</body>
</html>
